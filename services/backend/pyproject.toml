[project]
name = "backend"
version = "0.1.0"
description = "Packing inspection backend: checklists and inspection results in PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28",  # FastAPI TestClient, used by `python -m app.server check`
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.30",
]

[tool.uv]
package = false  # an app run with uvicorn, not a library to build
