[project]
name = "barcode-cv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Truong Anh", email = "vu.wspace@gmail.com" }
]
requires-python = ">=3.13.16"
dependencies = [
    "clip",
    "lap>=0.5.12",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "python-barcode>=0.16.1",
    "python-dotenv>=1.2.4",
    "rapidocr>=3.10.0",
    "ultralytics>=8.4.208",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
barcode-cv = "barcode_cv:main"

[tool.uv]
# rapidocr pulls opencv-python-headless, which overwrites cv2 from opencv-python (ultralytics) and removes the GUI
# (cv2.namedWindow: "The function is not implemented"). Both ship the same cv2 module, so never install headless.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
